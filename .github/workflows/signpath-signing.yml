name: Sign Hook UIAccess Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public Vx.x.x tag to sign
        required: true
        type: string
      candidate_run_id:
        description: Release workflow run ID that produced the reviewed signing candidate
        required: true
        type: string
      reviewed_sha256:
        description: Reviewed SHA-256 from the public signing-candidate manifest
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  sign-windows-uiaccess:
    runs-on: windows-latest
    environment: signpath-production

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag provenance and product versions
        shell: powershell
        run: |
          git fetch origin main --no-tags
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1 `
            -Tag "${{ inputs.tag }}" `
            -RequireTagAtHead `
            -RequireReachableFromBranch "origin/main"

      - name: Verify existing public release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view "${{ inputs.tag }}" --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($release.tagName -ne "${{ inputs.tag }}") {
            throw "Public release tag mismatch."
          }
          if ($release.isDraft -or $release.isPrerelease) {
            throw "Signing requires an existing non-draft, non-prerelease public release."
          }

      - name: Validate SignPath configuration
        shell: powershell
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          foreach ($name in @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required SignPath environment configuration: $name"
            }
          }

      - name: Download reviewed candidate from release workflow
        uses: actions/download-artifact@v7
        with:
          name: hook-uiaccess-signing-candidate-${{ inputs.tag }}
          path: release/Hook/reviewed-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download public candidate digest manifest
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path ".\release\Hook\public-provenance" -Force | Out-Null
          gh release download "${{ inputs.tag }}" `
            --pattern "hook-uiaccess-signing-candidate-${{ inputs.tag }}.json" `
            --dir ".\release\Hook\public-provenance" `
            --clobber

      - name: Verify reviewed candidate digest and provenance
        shell: powershell
        run: |
          $artifactManifest = ".\release\Hook\reviewed-candidate\manifest.json"
          $publicManifest = ".\release\Hook\public-provenance\hook-uiaccess-signing-candidate-${{ inputs.tag }}.json"
          if ((Get-FileHash $artifactManifest -Algorithm SHA256).Hash -ne (Get-FileHash $publicManifest -Algorithm SHA256).Hash) {
            throw "Workflow artifact manifest differs from the public release manifest."
          }
          $commit = (git rev-parse HEAD).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-reviewed-signing-candidate.ps1 `
            -ExePath ".\release\Hook\reviewed-candidate\hook.exe" `
            -ManifestPath $publicManifest `
            -ExpectedTag "${{ inputs.tag }}" `
            -ExpectedCommit $commit `
            -ExpectedRunId "${{ inputs.candidate_run_id }}" `
            -ReviewedSha256 "${{ inputs.reviewed_sha256 }}"

      - name: Upload unsigned payload to GitHub Actions
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: hook-uiaccess-reviewed-${{ inputs.tag }}-${{ inputs.candidate_run_id }}
          path: release/Hook/reviewed-candidate/hook.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit SignPath signing request
        id: submit-signing-request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: release/Hook/uiaccess-signed

      - name: Package signed UIAccess installer
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-uiaccess-installer-zip.ps1 `
            -ExePath ".\release\Hook\uiaccess-signed\hook.exe" `
            -OutputDir ".\release\Hook" `
            -Tag "${{ inputs.tag }}" `
            -Force

      - name: Upload signed installer workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: hook-uiaccess-signed-${{ inputs.tag }}
          path: release/Hook/hook-windows-uiaccess-installer-${{ inputs.tag }}.zip
          if-no-files-found: error

      - name: Publish signed installer on the existing GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: release/Hook/hook-windows-uiaccess-installer-${{ inputs.tag }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true
