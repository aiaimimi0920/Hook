name: Sign Hook UIAccess Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public Vx.x.x tag to sign
        required: true
        type: string
      candidate_run_id:
        description: Release workflow run ID that produced the reviewed signing candidate
        required: true
        type: string
      reviewed_sha256:
        description: Reviewed SHA-256 from the Actions signing-candidate manifest
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - name: Validate dispatch inputs as data before checkout
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        with:
          script: |
            const values = [process.env.REQUESTED_TAG, process.env.CANDIDATE_RUN_ID, process.env.REVIEWED_SHA256];
            const patterns = [/^[vV][0-9]+\.[0-9]+\.[0-9]+$/, /^[1-9][0-9]*$/, /^[a-fA-F0-9]{64}$/];
            if (values.some((v, i) => !v || /[\r\n]/.test(v) || !patterns[i].test(v))) throw new Error('Invalid signing inputs');
      - name: Checkout trusted signing policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate candidate producer using GitHub metadata
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        with:
          script: |
            const policy = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/signing-candidate-policy.cjs`);
            const result = await policy.verifyCandidate({ github, ...context.repo,
              tag: process.env.REQUESTED_TAG, runId: process.env.CANDIDATE_RUN_ID, digest: process.env.REVIEWED_SHA256 });
            core.setOutput('artifact-id', result.artifactId);
            core.setOutput('commit', result.commit);

  sign-windows-uiaccess:
    needs: validate-candidate
    runs-on: windows-latest
    environment: signpath-production
    permissions:
      actions: read
      contents: write
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
      EXPECTED_COMMIT: ${{ needs.validate-candidate.outputs.commit }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag provenance and product versions
        shell: powershell
        run: |
          git fetch origin main --no-tags
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1 `
            -Tag $env:REQUESTED_TAG `
            -RequireTagAtHead `
            -RequireReachableFromBranch "origin/main"

      - name: Verify existing public release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view $env:REQUESTED_TAG --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not query public release." }
          if ($release.tagName -cne $env:REQUESTED_TAG) {
            throw "Public release tag mismatch."
          }
          if ($release.isDraft -or $release.isPrerelease) {
            throw "Signing requires an existing non-draft, non-prerelease public release."
          }

      - name: Validate SignPath configuration
        shell: powershell
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          foreach ($name in @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required SignPath environment configuration: $name"
            }
          }

      - name: Download reviewed candidate from release workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate-candidate.outputs.artifact-id }}
          merge-multiple: true
          path: release/Hook/reviewed-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify reviewed candidate digest and provenance
        shell: powershell
        run: |
          . .\scripts\file-hash.ps1
          $artifactManifest = ".\release\Hook\reviewed-candidate\manifest.json"
          if (-not (Test-Path -LiteralPath $artifactManifest -PathType Leaf)) {
            throw "Reviewed candidate manifest is missing from the Actions artifact."
          }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:EXPECTED_COMMIT) { throw "Candidate tag moved after validation." }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-reviewed-signing-candidate.ps1 `
            -ExePath ".\release\Hook\reviewed-candidate\hook.exe" `
            -ManifestPath $artifactManifest `
            -ExpectedTag $env:REQUESTED_TAG `
            -ExpectedCommit $commit `
            -ExpectedRunId $env:CANDIDATE_RUN_ID `
            -ReviewedSha256 $env:REVIEWED_SHA256

      - name: Upload unsigned payload to GitHub Actions
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hook-uiaccess-reviewed-${{ inputs.tag }}-${{ inputs.candidate_run_id }}
          path: release/Hook/reviewed-candidate/hook.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit SignPath signing request
        id: submit-signing-request
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: release/Hook/uiaccess-signed

      - name: Package signed UIAccess installer
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-uiaccess-installer-zip.ps1 `
            -ExePath ".\release\Hook\uiaccess-signed\hook.exe" `
            -OutputDir ".\release\Hook" `
            -Tag $env:REQUESTED_TAG `
            -Force

      - name: Upload signed installer workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hook-uiaccess-signed-${{ inputs.tag }}
          path: release/Hook/hook-windows-uiaccess-installer-${{ inputs.tag }}.zip
          if-no-files-found: error

      - name: Publish signed installer on the existing GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/Hook/hook-windows-uiaccess-installer-${{ inputs.tag }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true
