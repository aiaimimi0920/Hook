name: Hook Runtime Performance Gates

on:
  workflow_dispatch:
    inputs:
      run_shader:
        description: Run the real 1080p/2K/4K WebGL shader gate
        required: true
        default: true
        type: boolean
      run_soak:
        description: Build Hook and run the real process memory/queue soak
        required: true
        default: false
        type: boolean
      soak_seconds:
        description: Runtime soak duration in seconds
        required: true
        default: "60"
        type: string
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: read

jobs:
  runtime-performance:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate product versions
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frame, queue-depth, memory, and bounded soak tests
        run: npm run test:performance

      - name: Run native mouse queue stress tests
        shell: powershell
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml input_lifecycle_hardening_tests::bounded_mouse_queue
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml input_lifecycle_hardening_tests::capture_move_coalescing

      - name: Run real WebGL shader performance gate
        if: github.event_name == 'schedule' || inputs.run_shader
        shell: powershell
        env:
          HOOK_SHADER_BENCH_ENFORCE: "1"
          HOOK_SHADER_BENCH_RESTORE_ITERATIONS: "3"
          HOOK_SHADER_BENCH_ADJUSTMENT_ITERATIONS: "12"
          HOOK_SHADER_BENCH_MAX_REHYDRATION_P95_MS: "10000"
          HOOK_SHADER_BENCH_MAX_ADJUSTMENT_P95_MS: "3000"
        run: npm run bench:shader

      - name: Build Hook for real process soak
        if: github.event_name == 'workflow_dispatch' && inputs.run_soak
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-local-hook-exe.ps1 `
            -OutputDir ".\release\Hook\runtime-soak" `
            -Force

      - name: Run real Hook process memory and queue soak
        if: github.event_name == 'workflow_dispatch' && inputs.run_soak
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-hook-runtime-soak.ps1 `
            -HookExe ".\release\Hook\runtime-soak\hook.exe" `
            -DurationSeconds ([int]"${{ inputs.soak_seconds }}") `
            -OutputPath ".\artifacts\runtime-performance\hook-runtime-soak.json"

      - name: Upload runtime performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hook-runtime-performance-${{ github.run_id }}
          path: artifacts/runtime-performance
          if-no-files-found: ignore
          retention-days: 14
