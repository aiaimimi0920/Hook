name: Release Hook Tag

on:
  push:
    tags:
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish manually
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit open-source dependency metadata
        run: npm run audit:licenses

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Rust format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        # Keep the release gate deterministic for env-sensitive Windows tests.
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build portable Hook EXE
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-local-hook-exe.ps1 -OutputDir "release\Hook\portable" -Force

      - name: Resolve release tag
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          "HOOK_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify tag and product versions
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1 `
            -Tag "$env:HOOK_TAG" `
            -RequireTagAtHead

      - name: Package minimal release zip
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-release-zip.ps1 `
            -ExePath ".\release\Hook\portable\hook.exe" `
            -OutputDir ".\release\Hook" `
            -Tag "$env:HOOK_TAG" `
            -Force

      - name: Publish portable GitHub release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.HOOK_TAG }}
          name: ${{ env.HOOK_TAG }}
          body_path: docs/GITHUB_RELEASE_BODY.md
          generate_release_notes: true
          files: |
            release/Hook/hook-windows-x64-${{ env.HOOK_TAG }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true
