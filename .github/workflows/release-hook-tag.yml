name: Release Hook Tag

on:
  push:
    tags:
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish manually
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          "HOOK_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify release provenance and product versions
        shell: powershell
        run: |
          git fetch origin main --no-tags
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1 `
            -Tag "$env:HOOK_TAG" `
            -RequireTagAtHead `
            -RequireReachableFromBranch "origin/main"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit open-source dependency metadata
        run: npm run audit:licenses

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Rust format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-rust-tests-ci.ps1

      - name: Build portable Hook EXE
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-local-hook-exe.ps1 -OutputDir "release\Hook\portable" -Force

      - name: Build reviewed UIAccess signing candidate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-local-hook-exe.ps1 `
            -OutputDir ".\release\Hook\signing-candidate" `
            -UiAccess `
            -AllowUnsignedUiAccessBuild `
            -Force

      - name: Create signing candidate digest manifest
        shell: powershell
        run: |
          . .\scripts\file-hash.ps1
          $candidateDir = [System.IO.Path]::GetFullPath(".\release\Hook\signing-candidate")
          $candidateExe = Join-Path $candidateDir "hook.exe"
          $commit = (git rev-parse HEAD).Trim()
          $sha256 = Get-HookFileSha256 -Path $candidateExe
          $manifest = [ordered]@{
            schemaVersion = 1
            artifact = "hook.exe"
            tag = $env:HOOK_TAG
            commit = $commit
            runId = "${{ github.run_id }}"
            sha256 = $sha256
          } | ConvertTo-Json
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $candidateDir "manifest.json"), $manifest + "`n", $utf8)
          [System.IO.File]::WriteAllText(
            [System.IO.Path]::GetFullPath(".\release\Hook\hook-uiaccess-signing-candidate-$env:HOOK_TAG.json"),
            $manifest + "`n",
            $utf8
          )

      - name: Upload reviewed signing candidate
        uses: actions/upload-artifact@v7
        with:
          name: hook-uiaccess-signing-candidate-${{ env.HOOK_TAG }}
          path: release/Hook/signing-candidate/*
          if-no-files-found: error
          retention-days: 30

      - name: Package minimal release zip
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-release-zip.ps1 `
            -ExePath ".\release\Hook\portable\hook.exe" `
            -OutputDir ".\release\Hook" `
            -Tag "$env:HOOK_TAG" `
            -Force

      - name: Publish portable GitHub release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.HOOK_TAG }}
          name: ${{ env.HOOK_TAG }}
          body_path: docs/GITHUB_RELEASE_BODY.md
          generate_release_notes: false
          files: |
            release/Hook/hook-windows-x64-${{ env.HOOK_TAG }}.zip
            release/Hook/hook-uiaccess-signing-candidate-${{ env.HOOK_TAG }}.json
          overwrite_files: true
          fail_on_unmatched_files: true
