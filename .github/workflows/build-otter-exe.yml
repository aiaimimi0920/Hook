name: Build Otter EXE

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout complete change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI change classification and gate contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py'
      - name: Classify immutable event diff
        id: scope
        run: python3 scripts/ci_change_scope.py
      - name: Validate documentation-only changes
        if: steps.scope.outputs.full == 'false'
        run: python3 scripts/check_changed_docs.py
      - name: Setup Node.js for documentation contracts
        if: steps.scope.outputs.full == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked documentation test dependencies
        if: steps.scope.outputs.full == 'false'
        run: npm ci --no-audit --no-fund
      - name: Run existing documentation contracts only
        if: steps.scope.outputs.full == 'false'
        run: >-
          npx vitest run
          __tests__/integration/OtterReadmeLocalizationContract.test.ts
          __tests__/integration/OtterSigningDocsContract.test.ts
          __tests__/integration/OtterDualDistributionContract.test.ts
          __tests__/integration/OtterDeveloperEntrypointsContract.test.ts
          __tests__/integration/OtterTestEntrypointContract.test.ts
          __tests__/integration/OtterArchivedDocsSanitizationContract.test.ts
          --pool threads --maxWorkers 1 --no-file-parallelism
      - name: Run the documentation case from the mixed public identity suite
        if: steps.scope.outputs.full == 'false'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          source = Path('__tests__/integration/OtterPublicIdentityContract.test.ts').read_text(encoding='utf-8')
          assert 'it("documents the current public bundle identity without obsolete app-data paths",' in source, 'Documentation case was renamed or removed; update the explicit selection'
          PYTHON
          npx vitest run __tests__/integration/OtterPublicIdentityContract.test.ts --testNamePattern 'documents the current public bundle identity without obsolete app-data paths' --pool threads --maxWorkers 1 --no-file-parallelism

  frontend-serial:
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate product versions before build setup
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Check CI cache and gate contracts
        run: python scripts/tests/test_ci_build_gates.py
      - name: Test effective-code-line checker
        run: npm run test:effective-lines
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: TypeScript typecheck (tests)
        run: npm run typecheck:test
      - name: Run frontend tests
        run: npm test

  build-windows-candidate:
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate product versions before build setup
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Rust tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-rust-tests-ci.ps1

      - name: Build portable Otter EXE
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-local-otter-exe.ps1 -OutputDir "release\Otter\portable" -Force

      - name: Stage unvalidated Otter build candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: otter-build-candidate
          path: release/Otter/portable/otter.exe
          if-no-files-found: error
          retention-days: 1

  # Keep the stable check even on docs-only changes. Only a successful scope
  # check may skip product gates; only all product gates can promote an EXE.
  build-windows-exe:
    needs: [change-scope, frontend-serial, build-windows-candidate, parallel-race]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the selected gates
        shell: bash
        env:
          SCOPE: ${{ needs.change-scope.result }}
          FULL: ${{ needs.change-scope.outputs.full }}
          FRONTEND: ${{ needs.frontend-serial.result }}
          BUILD: ${{ needs.build-windows-candidate.result }}
          PARALLEL: ${{ needs.parallel-race.result }}
        run: |
          test "$SCOPE" = success
          if [ "$FULL" = false ]; then
            test "$FRONTEND" = skipped
            test "$BUILD" = skipped
            test "$PARALLEL" = skipped
            echo 'Documentation checks passed; no executable was built.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$FULL" = true
          test "$FRONTEND" = success
          test "$BUILD" = success
          test "$PARALLEL" = success
      - name: Download same-run candidate
        if: needs.change-scope.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otter-build-candidate
          path: candidate
      - name: Upload portable Otter EXE artifact
        if: needs.change-scope.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: otter-portable-windows-x64
          path: candidate/otter.exe
          if-no-files-found: error

  parallel-race:
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate product versions
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests with file parallelism
        run: npm run test:parallel

      - name: Run deterministic runtime performance gates
        run: npm run test:performance

      # The JavaScript Surface smoke drives a real Chromium against a Vite server
      # with the shipped Tauri CSP, so it needs the Playwright browser payload.
      # It lives in this job rather than the release build to keep the artifact
      # path free of the browser download.
      - name: Cache pinned Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # Keep install and both browser gates even on a cache hit.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run JavaScript Surface browser smoke
        run: npm run test:surface-browser

      - name: Verify production QR module worker in Chromium
        run: node scripts/test-qr-worker-browser.mjs
      - name: Upload QR worker browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qr-worker-browser-evidence
          path: artifacts/qr-worker-browser
          if-no-files-found: error

      - name: Run Rust tests with default parallel test threads
        run: cargo test --manifest-path src-tauri/Cargo.toml
