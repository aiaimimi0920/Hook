name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 20 * * 0"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  inventory-contract:
    name: Validate CodeQL inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test source-text-free SARIF inventory
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m venv "${RUNNER_TEMP}/codeql-inventory-tests"
          "${RUNNER_TEMP}/codeql-inventory-tests/bin/python" -m pip install --disable-pip-version-check pytest==9.1.1
          "${RUNNER_TEMP}/codeql-inventory-tests/bin/python" -m pytest -q scripts/tests/test_codeql_summary.py
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Scan unchanged source too: PR-diff results are not a full inventory.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: ${{ matrix.language == 'javascript-typescript' && 'https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.zst' || '' }}
          queries: ${{ matrix.language != 'javascript-typescript' && 'security-extended' || '' }}
          config-file: ${{ matrix.language == 'javascript-typescript' && './.github/codeql/config.yml' || '' }}
      - name: Verify guarded-worker query model and full suite coverage
        if: matrix.language == 'javascript-typescript'
        run: node scripts/test-codeql-worker-model.mjs "${{ steps.init.outputs.codeql-path }}"
      - name: Upload guarded-worker model evidence
        if: ${{ !cancelled() && matrix.language == 'javascript-typescript' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-worker-model-evidence
          path: artifacts/codeql-worker-model
          if-no-files-found: error
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Report bounded CodeQL finding inventory
        if: ${{ !cancelled() }}
        run: python3 scripts/summarize_codeql_results.py codeql-results
